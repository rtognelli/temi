<!DOCTYPE html>
<html lang="it">
<head>
  <!--
    Pagina contenitore (D-057) pubblicata con GitHub Pages su https://temi.woo-ass.org
    Mostra a tutto schermo la web app Apps Script «Catalogo dei temi — WoOAss · Sapere Segni Sistemi»
    (progetto «catalogo interattivo temi wooass»). Parametri (?categorie=…) e stato (#…) dell'indirizzo
    passano al catalogo, così i link con filtri funzionano anche da temi.woo-ass.org.
    Se il link della web app cambiasse, aggiornare SOLO la costante URL_APP qui sotto.
  -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Catalogo dei temi — WoOAss · Sapere Segni Sistemi</title>
  <meta name="description" content="Catalogo interattivo dei temi delle conferenze WoOAss – Sapere Segni Sistemi: filtra per pubblico, ambito, relatore; guarda gli incontri già svolti e scarica il catalogo in PDF.">
  <meta property="og:title" content="Catalogo dei temi — WoOAss · Sapere Segni Sistemi">
  <meta property="og:description" content="Tutti i temi delle conferenze WoOAss, gli incontri già svolti e i relatori.">
  <meta property="og:url" content="https://temi.woo-ass.org/">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#1f4e8c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffd36b'/%3E%3Cstop offset='1' stop-color='%23ff8a3d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='5' y='9' width='38' height='34' rx='7' fill='%231f4e8c'/%3E%3Crect x='5' y='9' width='38' height='10' rx='5' fill='url(%23g)'/%3E%3Crect x='13' y='4' width='4' height='10' rx='2' fill='%231f4e8c'/%3E%3Crect x='31' y='4' width='4' height='10' rx='2' fill='%231f4e8c'/%3E%3Cpath d='M14 31l5 5 15-14' stroke='%23fff' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root { --blu: #1f4e8c; --sfondo: #eef1f5; --testo: #1d2330; --tenue: #667085; }
    @media (prefers-color-scheme: dark) { :root { --sfondo: #12161d; --testo: #e7eaf0; --tenue: #9aa4b2; } }
    html, body { margin: 0; height: 100%; background: var(--sfondo); color: var(--testo);
      font-family: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; }
    #attesa { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; text-align: center; padding: 16px; transition: opacity .3s; }
    #attesa.via { opacity: 0; pointer-events: none; }
    #attesa h1 { margin: 0; font-size: 1.3rem; color: var(--blu); }
    @media (prefers-color-scheme: dark) { #attesa h1 { color: #8db8f2; } }
    #attesa p { margin: 0; color: var(--tenue); font-size: .95rem; }
    #attesa a { color: inherit; }
    .rotella { width: 34px; height: 34px; border-radius: 50%; border: 4px solid rgba(61, 127, 209, .25);
      border-top-color: #3d7fd1; animation: gira 0.9s linear infinite; }
    @keyframes gira { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .rotella { animation-duration: 3s; } }
  </style>
</head>
<body>
  <div id="attesa" role="status" aria-live="polite">
    <div class="rotella" aria-hidden="true"></div>
    <h1>WoOAss · Catalogo dei temi</h1>
    <p>Caricamento in corso…</p>
    <p id="lento" hidden>Ci mette troppo? <a id="diretto" href="#">Apri l'app direttamente</a></p>
  </div>
  <iframe id="app" title="Catalogo dei temi WoOAss" allow="clipboard-write; fullscreen" allowfullscreen></iframe>
  <noscript>
    <p style="padding:16px">Per consultare il catalogo apri
      <a href="https://script.google.com/macros/s/AKfycbyXGGABeZzqyTI5FZWMa20AZldwP2MMva76BQnqJ95-Wo2uZz5BPu9FGf1urqMS7dQq/exec">questo collegamento</a>.</p>
  </noscript>
  <script>
    (function () {
      var URL_APP = 'https://script.google.com/macros/s/AKfycbyXGGABeZzqyTI5FZWMa20AZldwP2MMva76BQnqJ95-Wo2uZz5BPu9FGf1urqMS7dQq/exec';
      var app = document.getElementById('app');
      var attesa = document.getElementById('attesa');
      document.getElementById('diretto').href = URL_APP;
      // parametri (es. ?categorie=scolastico) e stato (#…) passano al catalogo così come sono
      app.src = URL_APP + (location.search || '') + (location.hash || '');
      app.addEventListener('load', function () { attesa.classList.add('via'); });
      setTimeout(function () { document.getElementById('lento').hidden = false; }, 12000);

      // D-061: il catalogo comunica il suo stato (#…) → l'indirizzo visibile lo segue;
      // in risposta gli diciamo il nostro indirizzo, che userà per «copia link» e nel PDF.
      // Si accettano messaggi SOLO dai server delle web app di Apps Script.
      window.addEventListener('message', function (e) {
        if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
        var d = e.data;
        if (!d || d.tipo !== 'wooass-catalogo' || typeof d.hash !== 'string' || d.hash.length > 8000) return;
        try { e.source.postMessage({ tipo: 'wooass-contenitore', base: location.origin + '/' }, e.origin); } catch (err) { /* ignorato */ }
        var nuovo = location.pathname + (d.hash ? '#' + d.hash : '');
        if (location.pathname + location.search + location.hash !== nuovo) history.replaceState(null, '', nuovo);
      });
    })();
  </script>
</body>
</html>
